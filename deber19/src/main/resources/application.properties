## definimos el tipo de base de datos
quarkus.datasource.db-kind=postgresql

## Usuario con el que se conecta a la base de datos
quarkus.datasource.username=postgres
## contraseña del usuario
quarkus.datasource.password=cueva1901

## URL de conexion a la base de datos
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/Carrito

##parametros recomendables
##quarkus.hibernate-orm.sql-load-script=import.sql
#quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
# Ampliar el tiempo máximo de espera a 10 minutos (600 segundos)
# Ampliar el tiempo máximo de espera a 10 minutos
quarkus.transaction-manager.default-transaction-timeout=PT10M
# Darle más conexiones a la base de datos para los hilos paralelos
quarkus.datasource.jdbc.max-size=50